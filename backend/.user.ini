; Sube los límites de subida de PHP para que acepte imágenes de hasta 100MB.
; Funciona cuando PHP corre como PHP-FPM/CGI (lo más común en cPanel). Se
; aplica solo a esta carpeta (backend/) y tarda unos minutos en tomar efecto
; tras subir el archivo (cPanel refresca .user.ini periódicamente).
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
